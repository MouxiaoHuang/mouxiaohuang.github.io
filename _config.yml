# Site identity
title: Mouxiao Huang 黄谋潇
name: Mouxiao Huang 黄谋潇
author: Mouxiao Huang
description: Algorithm Engineer @ Huawei
lang: en
timezone: Asia/Shanghai
avatar: /images/avatar.jpg

# GitHub Pages and canonical URLs
url: https://mouxiaohuang.com
baseurl: ""
repository: MouxiaoHuang/mouxiaohuang.github.io

# Optional integrations
disqus:
google_analytics:

# Content
markdown: kramdown
permalink: /blogs/:title/
excerpt_separator: "<!--more-->"
future: false
show_drafts: false
strict_front_matter: true

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

sass:
  style: expanded

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

# Development-only files should not be copied into the generated site.
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - scripts
